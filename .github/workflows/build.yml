name: Build and test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        run: dotnet test vibe-ui.slnx -c Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results
      - name: Publish self-contained app
        run: dotnet publish VibeUi.Desktop -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -o artifacts/stage/${{ matrix.rid }}/vibe-ui
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibe-ui-${{ matrix.rid }}
          path: artifacts/stage/${{ matrix.rid }}/**/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
